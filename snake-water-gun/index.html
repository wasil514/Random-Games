<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Water Gun Game- Wazer Studios</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Snake Water or Gun</h1>
        <p>Choose your piece carefully</p>
        <div>Do you have what it takes to win the game</div>
    </header>

    <main>
        <div>
            <input id ="name" type="text" placeholder="What's your name" required>
        </div>
        <div id="hellotag">

        </div>

        <div>
            <select id="Choice" required>
                <option value="" disabled selected>Snake Water Or Gun</option>
                <option value="Snake">Snake</option>
                <option value="Water">Water</option>
                <option value="Gun">Gun</option>
            </select>
        </div>
        <button id="startbtn">Start Game</button>

        
        <div id="result">

        </div>

        <div id="finalresult">

        </div>

        <button id="endbtn">End the game</button>

    </main>

    <footer>
        <Div>Made by Wazer Studios</Div>
        <div>Copyright &copy;| All Rights reserved</div>
    </footer>
    <script src="script.js"></script>
    
</body>

</html>
